<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; script-src 'self' 'unsafe-inline'; style-src 'self' 'unsafe-inline'; img-src 'self' data: blob:; connect-src 'self'; object-src 'none'; base-uri 'none'; form-action 'none'; frame-src 'none'; worker-src 'self'; manifest-src 'self'">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#9a4b1c">
<title>VastuSense</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" href="icon.svg" type="image/svg+xml">
<link rel="stylesheet" href="app.css">
</head>
<body>
<header class="top">
  <div class="brand">VastuSense<small class="sub">VastuSutras by Anoopam</small></div>
  <nav id="menu"></nav>
  <div class="ctl">
    <select id="langsel" aria-label="Language"></select>
    <button id="themebtn" class="ic" title="Theme">&#9680;</button>
    <button id="fdown" class="ic" title="A-">A&minus;</button>
    <button id="fup" class="ic" title="A+">A+</button>
    <button id="adminbtn" class="ic" style="display:none" onclick="authAdmin()"></button>
    <button id="authbtn" class="ic" onclick="authBtn()"></button>
  </div>
</header>
<div class="layout">
  <aside id="sub"></aside>
  <section id="panel" class="panel"></section>
  <section class="mapcol">
    <div class="maptools" id="maptools"></div>
    <div class="mapwrap"><canvas id="map" width="900" height="650"></canvas>
      <div id="empty" class="empty"></div>
    </div>
    <div id="zoneinfo" class="zoneinfo"></div>
  </section>
</div>
<div id="reportview"></div>
<div id="ctxmenu" class="ctx" style="display:none" role="menu"></div>
<script src="data.js"></script>
<script src="i18n.js"></script>
<script src="map.js"></script>
<script src="app.js"></script>
</body>
</html>
